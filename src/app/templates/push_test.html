{% extends "page.html" %}
{% block title %}알림 시험 · 바로채널{% endblock %}
{% block content %}
<h1>알림 시험</h1>
<div id="push-test" data-key="{{ public_key }}">
  <p id="push-ios" class="notice" hidden>iPhone·iPad는 Safari의 <strong>공유 → 홈 화면에 추가</strong>로 추가한 뒤, 홈 화면의 바로채널을 열고 다시 로그인해 <strong>전체 → 알림 시험</strong>으로 들어오세요.</p>
  <section class="section">
    <h2>시험</h2>
    <p><button class="primary" data-do="on">1. 이 기기에서 알림 켜기</button></p>
    <p><button data-do="now">2. 바로 보내기</button></p>
    <p><button data-do="soon">3. 10초 뒤 보내기 (화면 잠금)</button></p>
    <p><button data-do="later">4. 60초 뒤 보내기 (앱 종료)</button></p>
    <p><button data-do="off">알림 끄기</button> <button data-do="copy">결과 복사</button></p>
  </section>
  <section class="section">
    <h2>기록</h2>
    <pre id="push-log" style="white-space: pre-wrap; overflow-wrap: anywhere"></pre>
  </section>
  <section class="section">
    <h2>이 기기</h2>
    <ul id="push-state" style="overflow-wrap: anywhere"></ul>
  </section>
</div>
<script src="{{ asset('push-test.js') }}" defer></script>
{% endblock %}
